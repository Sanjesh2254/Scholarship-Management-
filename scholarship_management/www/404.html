<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oops! Error Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Optional: Bootstrap for quick buttons/layout (can remove if not needed) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f8ff;
      --card: #ffffff;
      --text: #1f2d3d;
      --muted:#6b7a90;
      --accent:#586ffb;
      --accent-2:#ff9f68;
      --shadow: 0 20px 60px rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0d1117;
        --card:#0f1520;
        --text:#e6edf3;
        --muted:#9aa8b4;
        --accent:#7aa2ff;
        --accent-2:#ffb28a;
        --shadow: 0 20px 60px rgba(0,0,0,.35);
      }
    }

    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:
        radial-gradient(1000px 600px at 10% -10%, rgba(88,111,251,.12), transparent 60%),
        radial-gradient(800px 500px at 110% 10%, rgba(255,159,104,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,"Helvetica Neue",Arial,sans-serif;
    }

    .wrap{
      width:min(980px, 92vw);
      display:grid; grid-template-columns: 1.1fr 1fr; gap:clamp(20px, 4vw, 48px);
      align-items:center;
      padding:clamp(16px, 3vw, 28px);
    }
    @media (max-width: 900px){
      .wrap{ grid-template-columns: 1fr; padding: 20px; }
    }

    .card{
      background:var(--card); border-radius:24px; box-shadow:var(--shadow);
      padding:clamp(22px, 4vw, 36px); position:relative; overflow:hidden;
      isolation:isolate;
    }

    .badge-code{
      position:absolute; top:18px; right:18px; font-weight:700;
      letter-spacing:.04em; font-size:.85rem; background:rgba(88,111,251,.1);
      color:var(--accent); border:1px solid rgba(88,111,251,.25);
      padding:.35rem .6rem; border-radius:999px;
    }

    .title{ font-size:clamp(1.8rem, 3.4vw, 2.6rem); line-height:1.15; margin:0 0 10px }
    .lead{ color:var(--muted); margin:0 0 18px; font-size:clamp(1rem, 1.6vw, 1.1rem) }

    /* Speech bubble */
    .bubble{
      position:relative; background:linear-gradient(180deg, #fff, #fafaff);
      color:#1f2d3d; border-radius:18px; padding:14px 16px; max-width:520px;
      border:1px solid rgba(0,0,0,.06); box-shadow: 0 10px 30px rgba(88,111,251,.12);
      margin:14px 0 18px; font-weight:600;
    }
    .bubble::after{
      content:""; position:absolute; left:22px; bottom:-8px; width:18px; height:18px;
      background:inherit; border:inherit; transform:rotate(45deg);
      box-shadow: -3px 3px 10px rgba(88,111,251,.12);
    }
    .type{
      white-space:nowrap; overflow:hidden; display:inline-block;
      border-right:2px solid var(--accent);
      animation: typing 3.5s steps(40,end) 0.4s both, caret 800ms steps(1) infinite;
    }
    @keyframes typing{ from{width:0} to{width:100%} }
    @keyframes caret{ 50%{ border-color: transparent } }

    .cta{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px }
    .btn-pill{
      border-radius:999px; padding:.7rem 1.2rem; font-weight:600;
      transition: transform .08s ease;
    }
    .btn-pill:active{ transform: translateY(1px) }

    /* Illustration pane */
    .scene{
      position:relative; aspect-ratio: 1.1 / 1; min-height: 340px;
      background: radial-gradient(140px 100px at 80% 20%, rgba(122,162,255,.06), transparent 60%);
      border-radius:24px; box-shadow:var(--shadow); overflow:hidden;
    }
    .stage{
      position:absolute; inset:0; display:grid; place-items:center;
    }

    /* Floating animation */
    .floaty{ animation: floaty 4.5s ease-in-out infinite; transform-origin:center }
    @keyframes floaty{
      0%,100%{ transform: translateY(0px) }
      50%{ transform: translateY(-10px) }
    }

    /* Waving hand (rotating around shoulder) */
    .hand{ transform-origin: 220px 135px; animation: wave 1.8s ease-in-out infinite }
    @keyframes wave{
      0%,100%{ transform: rotate(0deg) }
      50%{ transform: rotate(18deg) }
    }

    /* Eye blink */
    .eye{ transform-origin:center; animation: blink 5s infinite }
    @keyframes blink{
      0%, 97%, 100%{ transform: scaleY(1) }
      98%, 99%{ transform: scaleY(0.1) }
    }

    /* Decorative blobs */
    .blob{ position:absolute; filter: blur(24px); opacity:.5; border-radius:50% }
    .blob.a{ width:180px; height:180px; background:var(--accent); top:-20px; right:-20px; opacity:.25 }
    .blob.b{ width:220px; height:220px; background:var(--accent-2); bottom:-30px; left:-30px; opacity:.18 }
  </style>
</head>
<body>

  <main class="wrap" role="main" aria-labelledby="page-title">
    <section class="card">
      <span class="badge-code" aria-hidden="true">Error</span>
      <h1 id="page-title" class="title">Oops — something went wrong!</h1>
      <p class="lead">The page you’re looking for might have moved, been renamed, or never existed.</p>

      <div class="bubble" aria-live="polite">
        <span class="type">Hi! I’m your friendly guide. This looks like an error page — let’s head back home.</span>
      </div>

      <div class="cta">
        <a href="/" class="btn btn-primary btn-pill">
          ⟵ Go to Home
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-pill">
          Go Back
        </a>
       
      </div>
    </section>

    <section class="scene" aria-hidden="true">
      <div class="blob a"></div>
      <div class="blob b"></div>

      <div class="stage">
        <!-- Inline SVG: friendly human character -->
        <svg class="floaty" width="100%" height="100%" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
          <!-- Ground shadow -->
          <ellipse cx="210" cy="340" rx="110" ry="18" fill="rgba(0,0,0,.08)"/>
          <!-- Body -->
          <rect x="170" y="170" width="80" height="110" rx="16" fill="#586ffb"/>
          <!-- Head -->
          <circle cx="210" cy="130" r="40" fill="#ffd4b8" />
          <!-- Hair -->
          <path d="M170 130c6-26 35-40 60-26 12 6 18 18 18 26 0 0-12-10-30-7-18 3-33 13-48 7z" fill="#2d3559"/>
          <!-- Eyes -->
          <ellipse class="eye" cx="196" cy="132" rx="4.5" ry="6" fill="#1f2d3d"/>
          <ellipse class="eye" cx="224" cy="132" rx="4.5" ry="6" fill="#1f2d3d"/>
          <!-- Smile -->
          <path d="M196 148c6 6 18 6 24 0" stroke="#1f2d3d" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Left arm -->
          <rect x="148" y="185" width="22" height="64" rx="10" fill="#7aa2ff"/>
          <!-- Right arm (waving) -->
          <g class="hand">
            <rect x="250" y="115" width="22" height="84" rx="10" fill="#7aa2ff" transform="rotate(30 250 115)"/>
            <circle cx="270" cy="105" r="12" fill="#ffd4b8"/>
            <!-- Hand motion lines -->
            <path d="M300 90 q10 12 -2 24" stroke="#ffb28a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
            <path d="M292 70 q14 14 -1 28" stroke="#ffb28a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
          </g>
          <!-- Pants -->
          <rect x="170" y="280" width="80" height="42" rx="10" fill="#2d3559"/>
          <!-- Shoes -->
          <rect x="172" y="320" width="30" height="12" rx="6" fill="#1f2d3d"/>
          <rect x="218" y="320" width="30" height="12" rx="6" fill="#1f2d3d"/>
          <!-- Floating shapes -->
          <circle cx="70" cy="80" r="10" fill="#ff9f68" opacity=".6"/>
          <circle cx="360" cy="130" r="8" fill="#7aa2ff" opacity=".6"/>
          <rect x="330" y="260" width="14" height="14" rx="4" fill="#7aa2ff" opacity=".4"/>
          <rect x="60" y="260" width="14" height="14" rx="4" fill="#ff9f68" opacity=".4"/>
        </svg>
      </div>
    </section>
  </main>

  <footer class="text-center py-3" style="opacity:.7; font-size:.9rem">
    © <span id="yr"></span> Your Site • Need help? <a href="/contact">Contact support</a>
  </footer>

  <script>
    // Current year in footer
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
