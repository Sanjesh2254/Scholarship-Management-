<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Global */
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f0f4f8, #e8f5e9);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    color: #1a202c;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: linear-gradient(90deg, #4cafef, #2ecc71);
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}
.navbar .logo {
    font-size: 1.8rem;
    font-weight: 700;
}
.navbar .nav-links {
    display: flex;
    gap: 30px;
}
.navbar .nav-links a {
    text-decoration: none;
    color: #1a202c;
    font-weight: 600;
    position: relative;
}
.navbar .nav-links a::after {
    content: '';
    height: 2px;
    width: 0;
    background: #38a169;
    position: absolute;
    left: 0;
    bottom: -5px;
    transition: width 0.3s ease;
}
.navbar .nav-links a:hover::after { width: 100%; }
.menu-toggle { display: none; font-size: 1.8rem; cursor: pointer; }
@media (max-width:768px){
    .navbar .nav-links {
        display: none;
        flex-direction: column;
        gap: 15px;
        background: rgba(255,255,255,0.95);
        padding: 20px;
        position: absolute;
        top: 60px;
        right: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    .navbar .nav-links.active {display:flex;}
    .menu-toggle {display:block;}
}

/* Slideshow */
.slideshow-container {
    position: relative;
    max-width: 1000px;
    margin: 30px auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.slides {
    display: none;
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 20px;
    animation: fade 1.5s;
}
@keyframes fade { from {opacity:0.4;} to {opacity:1;} }

/* Header */
h1 {text-align:center; font-size:2.5rem; margin:40px 0 20px 0;}

/* Container */
.container {max-width:1200px; margin:0 auto; padding:0 20px;}

/* Filters */
.filters {display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:40px;}
.filters input[type="text"], .filters select {
    padding:14px 20px;
    border-radius:50px;
    border:none;
    outline:none;
    font-size:1rem;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    box-shadow:0 6px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}
.filters input:focus, .filters select:focus {
    transform: scale(1.05);
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

/* Scholarship Cards */
.scholarship-list {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:30px;
}
.scholarship-card {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    transition: all 0.4s ease;
    opacity:0;
    transform: translateY(30px);
    animation: fadeInUp 0.6s forwards;
}
.scholarship-card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
}
.scholarship-card h3 {margin:0 0 12px 0; font-size:1.6rem;}
.scholarship-card p {margin:6px 0; font-weight:500;}
.scholarship-card span {font-weight:700; color:#38a169;}

/* Badge */
.badge {
    display:inline-block;
    padding:4px 12px;
    border-radius:12px;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:10px;
    background:#38a16933;
    color:#276749;
}

/* Animations */
@keyframes fadeInUp { to {opacity:1; transform:translateY(0);} }

/* No Results */
.no-results {text-align:center; color:#e53e3e; font-size:20px; margin-top:50px; font-weight:600;}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">Scholarship Explorer</div>
    <div class="nav-links" id="navLinks">
        <a href="#">Home</a>
        <a href="#">Scholarships</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
    <div class="menu-toggle" id="menuToggle">&#9776;</div>
</div>

<!-- Slideshow -->
<div class="slideshow-container">
    <img class="slides" src="https://theverifiedpakistan.com/wp-content/uploads/2024/02/Fully-funded-opportunity-for-students-with-Manaaki-Scholarship-in-New-Zealand.jpg" alt="Slide 1">
    <img class="slides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt3H8Cxa8abs1d15UxrdufMKczUyVc7Wrsvw&s" alt="Slide 2">
    <img class="slides" src="https://devsthali.edu.in/assets/img/course/scholarship.webp" alt="Slide 3">
</div>

<div class="container">
    <div class="filters">
        <input type="text" id="searchInput" placeholder="Search scholarship...">
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Merit-based">School-Level</option>
            <option value="Need-based">Undergraduate</option>
        </select>
    </div>

    <!-- ✅ FIXED: Missing scholarship list container -->
    <div class="scholarship-list" id="scholarshipList"></div>

    <div class="no-results" id="noResults" style="display:none;">No scholarships found.</div>
</div>

<script>
async function loadScholarships() {
  try {
    const response = await fetch(
      "http://127.0.0.1:8007/api/resource/Scholarship?fields=[\"name\"]"
    );
    const data = await response.json();
    const list = document.getElementById("scholarshipList");
    list.innerHTML = "";

    if (data.data && data.data.length) {
      data.data.forEach((s,i) => {
        const card = document.createElement("div");
        card.className = "scholarship-card";
        card.dataset.name = s.name;
        card.dataset.category = s.scholarship_type; 
        card.dataset.category = s.amount; 
        card.dataset.category = s.end_date; 

        card.innerHTML = `
          <span class="badge">${card.dataset.category}</span>
          <h3>${s.scholarship_type}</h3>
        `;
        list.appendChild(card);
      });
    } else {
      document.getElementById("noResults").style.display = "block";
    }
  } catch (err) {
    console.error("Error loading scholarships:", err);
  }
}

function filterScholarships() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const selectedCategory = document.getElementById('categoryFilter').value;
    const scholarshipList = document.getElementById('scholarshipList');
    const noResults = document.getElementById('noResults');

    let visibleCount = 0;
    Array.from(scholarshipList.children).forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const category = card.dataset.category;
        if(name.includes(searchTerm) && (selectedCategory === "" || category === selectedCategory)) {
            card.style.display = "block";
            visibleCount++;
        } else {
            card.style.display="none";
        }
    });
    noResults.style.display = visibleCount === 0 ? "block" : "none";
}

document.getElementById("searchInput").addEventListener("input", filterScholarships);
document.getElementById("categoryFilter").addEventListener("change", filterScholarships);

// Mobile menu toggle
const menuToggle = document.getElementById('menuToggle');
const navLinks = document.getElementById('navLinks');
menuToggle.addEventListener('click', ()=>{navLinks.classList.toggle('active');});

// Slideshow
let slideIndex = 0;
function showSlides() {
    const slides = document.getElementsByClassName("slides");
    for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
    slideIndex++;
    if (slideIndex > slides.length) slideIndex = 1;
    slides[slideIndex-1].style.display = "block";
    setTimeout(showSlides, 4000);
}
showSlides();


loadScholarships();
</script>
</body>
</html>
